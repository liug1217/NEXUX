<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下載 NEXUX 桌面版</title>
<link rel="icon" href="/NEXUX.png">
<style>
  :root {
    --bg: #212121;
    --panel: #2a2a2a;
    --panel-border: rgba(255, 255, 255, 0.1);
    --ink: #ece8de;
    --ink-dim: #9b9b9b;
    --accent: #6f9a6e;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }

  .card img {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .card h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  .card p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 24px;
  }

  .download-btn {
    display: inline-block;
    width: 100%;
    padding: 14px 0;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 10px;
  }

  .download-btn:active {
    opacity: 0.85;
  }

  .meta {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .back-link {
    display: inline-block;
    margin-top: 24px;
    font-size: 13px;
    color: var(--ink-dim);
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/NEXUX.png" alt="NEXUX">
    <h1>NEXUX 桌面版</h1>
    <p>雙擊下載好的 .exe 就能直接開啟 NEXUX 聊天介面,不用自己開瀏覽器打網址。這是一個輕量的視窗捷徑,需要網路連線才能使用(沒有內建 AI 模型)。</p>
    <a class="download-btn" href="/NEXUX_desktop.exe" download>下載 NEXUX_desktop.exe</a>
    <p class="meta">僅支援 Windows,檔案約 18MB</p>
    <a class="back-link" href="/">回到聊天介面</a>
  </div>
</body>
</html>
