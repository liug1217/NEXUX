    });

    document.getElementById("inviteModalSave").addEventListener("click", () => {
      const name = document.getElementById("inviteNameInput").value.trim();
      if (!name) { document.getElementById("inviteNameInput").focus(); return; }
      const sel = inviteMemberModalOverlay.querySelector(".modal-avatar-color.selected");
      const color = sel ? sel.dataset.color : "#5a6e8a";
      inviteMembers.push({ name, color, image: inviteImageDataUrl || null });
      saveInviteMembers();
      inviteMemberModalOverlay.setAttribute("hidden", "");
      renderMembersList();
    });

    inviteMemberModalOverlay.querySelectorAll(".modal-avatar-color").forEach((btn) => {
      btn.addEventListener("click", () => {
        inviteMemberModalOverlay.querySelectorAll(".modal-avatar-color").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    // init
    inviteMembers = loadInviteMembers();
    renderMembersList();
    if (!loadProfile()) openProfileSetupModal();

    // ---- 角色選單(#roleMenu)開關/定位 ----

    function positionRoleMenu() {
      const rect = roleMenuBtn.getBoundingClientRect();
      roleMenu.style.bottom = `${window.innerHeight - rect.top + 10}px`;
      roleMenu.style.right = `${window.innerWidth - rect.right}px`;
    }

    function updateRoleMenuBadge() {
      const count = selectedRoles.size;
      roleMenuBadge.hidden = count === 0;
      roleMenuBadge.textContent = String(count);
      roleMenuBtn.classList.toggle("has-selection", count > 0);
    }

    // 選單分兩頁:第一頁只有一顆「設定AI角色人員」項目,點了才切到第二頁
    // (返回+預設角色+我的角色+建立角色的完整清單)。每次選單整個
    // 重新打開時都固定從第一頁開始,「返回」是回到第一頁,不是直接
    // 關掉整個選單(關閉選單要點選單外面,或再點一次工具列上的按鈕)。
    function showRoleMenuEntryPage() {
      roleMenuEntryPage.hidden = false;
      roleMenuListPage.hidden = true;
    }

    function showRoleMenuListPage() {
      roleMenuEntryPage.hidden = true;
      roleMenuListPage.hidden = false;
    }

    function closeRoleMenu() {
      roleMenu.hidden = true;
      roleMenuBtn.setAttribute("aria-expanded", "false");
    }

    roleMenuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = roleMenu.hidden;
      if (willOpen) {
        showRoleMenuEntryPage();
        positionRoleMenu();
        roleMenu.hidden = false;
        roleMenuBtn.setAttribute("aria-expanded", "true");
      } else {
        closeRoleMenu();
      }
    });

    roleMenuEntryBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      showRoleMenuListPage();
      positionRoleMenu();
    });

    roleMenuBackBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      showRoleMenuEntryPage();
      positionRoleMenu();
    });

    // 點選單以外的地方自動收合,跟一般下拉選單的慣例行為一致。#roleMenu
    // 已經搬到 <body> 底下,不再是 .role-menu-wrap 的子元素,這裡要多
    // 判斷 #roleMenu 本身,不然點裡面的按鈕會被誤判成「點了選單外面」
    // 而瞬間關掉。
    document.addEventListener("click", (e) => {
      const insideRoleMenu = e.target.closest(".role-menu-wrap") || e.target.closest("#roleMenu");
      if (!roleMenu.hidden && !insideRoleMenu) {
        closeRoleMenu();
      }
    });

    // ---- 選取/toggle ----

    function toggleRoleSelection(id, itemEl) {
      if (selectedRoles.has(id)) {
        selectedRoles.delete(id);
        itemEl.classList.remove("is-selected");
      } else {
        if (selectedRoles.size >= MAX_TEAM_ROLES) {
          alert(`一次最多只能選 ${MAX_TEAM_ROLES} 個角色。`);
          return;
        }
        selectedRoles.add(id);
        itemEl.classList.add("is-selected");
      }
      updateRoleMenuBadge();
      renderMembersList();
    }

    // ---- 角色選單項目渲染 ----

    function buildRoleMenuItem(role) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "role-menu-item";
      if (selectedRoles.has(role.id)) item.classList.add("is-selected");
      item.dataset.role = role.id;
      item.appendChild(buildRoleIconSpan(role.icon));
      const textSpan = document.createElement("span");
      textSpan.className = "role-menu-item-label";
      textSpan.textContent = role.label; // 使用者輸入的文字,一律走textContent,不經過innerHTML
      item.appendChild(textSpan);

      item.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleRoleSelection(role.id, item);
      });

      // 角色框框右邊的鉛筆圖示:點了直接開啟「編輯提示詞」視窗(查看跟
      // 編輯合併成同一個視窗,不用分兩步),預設角色在視窗裡多一顆
      // 「恢復預設」按鈕。刪除(僅我的角色)維持用旁邊的「×」快速鈕,
      // 不需要另外做選單。用 <span role="button"> 而不是 <button>:
      // item 本身已經是 <button>,HTML 規格不允許互動元素互相巢狀。
      const editBtn = document.createElement("span");
      editBtn.className = "role-menu-item-edit";
      editBtn.setAttribute("role", "button");
      editBtn.setAttribute("tabindex", "0");
      editBtn.setAttribute("aria-label", `編輯${role.label}的提示詞`);
      editBtn.appendChild(buildRoleIconSpan("edit"));
      editBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          editBtn.click();
        }
      });
      // 預設角色跟我的角色的編輯用同一個提示語視窗(格式一致,不會
      // 因為角色來源不同而有兩套不一樣的編輯方式),差別只在預設角色
      // 才有「恢復預設」按鈕(見 openRolePromptModal)。名稱/身份/任務/
      // 回答風格4個欄位只在「建立」我的角色時用來組出提示語,建立後
      // 一律用這個視窗直接編輯組好的提示語原文。
      editBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openRolePromptModal(role);
      });
      item.appendChild(editBtn);

      if (role.kind === "custom") {
        // 這個快速刪除鈕是「刪除」這個角色,跟鉛筆圖示開的「編輯」是
        // 不同動作,兩者並存。
        const removeBtn = document.createElement("span");
        removeBtn.className = "role-menu-item-remove";
        removeBtn.setAttribute("role", "button");
        removeBtn.setAttribute("tabindex", "0");
        removeBtn.setAttribute("aria-label", "移除這個自訂角色");
        removeBtn.textContent = "×";
        removeBtn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            removeBtn.click();
          }
        });
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteCustomRole(role.id);
        });
        item.appendChild(removeBtn);
      }

      return item;
    }

    function renderRoleMenu() {
      const presetSection = document.getElementById("roleMenuPresetSection");
      const customSection = document.getElementById("roleMenuCustomSection");
      presetSection.innerHTML = "";
      customSection.innerHTML = "";

      presetRoles.forEach((role) => presetSection.appendChild(buildRoleMenuItem(role)));
      customRoles.forEach((role) => customSection.appendChild(buildRoleMenuItem(role)));

      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "role-menu-item role-menu-add-btn";
      addBtn.appendChild(buildRoleIconSpan("add"));
      const addLabel = document.createElement("span");
      addLabel.textContent = "建立角色";
      addBtn.appendChild(addLabel);
      addBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openRoleFormModal();
      });
      customSection.appendChild(addBtn);

      updateRoleMenuBadge();
    }

    function deleteCustomRole(id) {
      selectedRoles.delete(id);
      customRoles = customRoles.filter((r) => r.id !== id);
      saveCustomRolesToStorage();
      updateRoleMenuBadge();
      renderRoleMenu();
    }

    // ---- 提示語視窗(預設角色/我的角色共用同一個編輯格式,不會因為
    // 角色來源不同而有兩套不一樣的編輯方式)。查看+編輯合併成同一個
    // 視窗,「恢復預設」直接放在視窗裡(只有預設角色會顯示這顆按鈕,
    // 我的角色沒有「預設值」可以恢復)。 ----

    let rolePromptModalRoleId = null;

    function openRolePromptModal(role) {
      rolePromptModalRoleId = role.id;
      rolePromptModalTitle.textContent = "編輯提示詞 - " + role.label;
      rolePromptModalTextarea.value = role.promptTemplate;
      rolePromptModalRestore.hidden = role.kind !== "preset";
      rolePromptModalOverlay.hidden = false;
    }

    function closeRolePromptModal() {
      rolePromptModalOverlay.hidden = true;
      rolePromptModalRoleId = null;
    }

    rolePromptModalCancel.addEventListener("click", closeRolePromptModal);
    rolePromptModalOverlay.addEventListener("click", (e) => {
      if (e.target === rolePromptModalOverlay) closeRolePromptModal();
    });

    // 只是把預設值填回textarea裡讓使用者看/繼續改,還沒真的存檔,
    // 要點「儲存」才會真的生效——避免不小心點到「恢復預設」就直接
    // 沒得反悔地蓋掉原本的編輯內容。
    rolePromptModalRestore.addEventListener("click", () => {
      const role = presetRoles.find((r) => r.id === rolePromptModalRoleId);
      if (role) rolePromptModalTextarea.value = role.defaultPromptTemplate;
    });

    rolePromptModalSave.addEventListener("click", () => {
      const id = rolePromptModalRoleId;
      const newTemplate = rolePromptModalTextarea.value.trim();
      if (!newTemplate) {
        alert("提示詞不能是空的。");
        return;
      }
      const role = findRoleById(id);
      if (!role) {
        closeRolePromptModal();
        return;
      }
      role.promptTemplate = newTemplate;
      if (role.kind === "preset") {
        const overrides = loadPresetOverridesFromStorage();
        if (newTemplate === role.defaultPromptTemplate) {
          delete overrides[id]; // 改回跟預設一樣,不用再當作「有覆寫」存著
        } else {
          overrides[id] = newTemplate;
        }
        savePresetOverridesToStorage(overrides);
      } else {
        saveCustomRolesToStorage();
      }
      closeRolePromptModal();
      renderRoleMenu();
    });

    // ---- 我的角色建立視窗(名稱+身份+任務+回答風格,只用來組出建立
    // 時的初始提示語;建立後一律用上面同一個提示語視窗編輯,不會再
    // 回頭用這4個欄位的表單,格式才能跟預設角色的編輯方式一致)。 ----

    function openRoleFormModal() {
      roleFormName.value = "";
      roleFormIdentity.value = "";
      roleFormTask.value = "";
      roleFormStyle.value = "";
      roleFormModalOverlay.hidden = false;
      roleFormName.focus();
    }

    function closeRoleFormModal() {
      roleFormModalOverlay.hidden = true;
    }

    roleFormCancel.addEventListener("click", closeRoleFormModal);
    roleFormModalOverlay.addEventListener("click", (e) => {
      if (e.target === roleFormModalOverlay) closeRoleFormModal();
    });

    roleFormSave.addEventListener("click", () => {
      const name = roleFormName.value.trim().slice(0, CUSTOM_LABEL_MAX_LEN);
      if (!name) {
        alert("請輸入角色名稱。");
        return;
      }
      if (customRoles.length >= MAX_CUSTOM_ROLES) {
        alert(`最多只能建立 ${MAX_CUSTOM_ROLES} 個自訂角色。`);
        return;
      }
      const identity = roleFormIdentity.value.trim().slice(0, CUSTOM_FIELD_MAX_LEN);
      const task = roleFormTask.value.trim().slice(0, CUSTOM_FIELD_MAX_LEN);
      const style = roleFormStyle.value.trim().slice(0, CUSTOM_FIELD_MAX_LEN);
      const promptTemplate = composeCustomRoleTemplate(name, identity, task, style);

      customRoleSeq += 1;
      const id = `custom_${Date.now()}_${customRoleSeq}`;
      customRoles.push({ id, kind: "custom", icon: "custom", label: name, promptTemplate, identity, task, style });
      if (selectedRoles.size < MAX_TEAM_ROLES) {
        selectedRoles.add(id);
      }
      saveCustomRolesToStorage();
      closeRoleFormModal();
      renderRoleMenu();
    });

    // ---- provider 切換時的連動 ----

    function syncRoleSelectorWithProvider() {
      const isOwn = providerSelect.value === "own";
      roleMenuBtn.disabled = !isOwn;
      if (!isOwn && selectedRoles.size > 0) {
        selectedRoles.clear();
        renderRoleMenu();
        closeRoleMenu();
      }
    }
    providerSelect.addEventListener("change", syncRoleSelectorWithProvider);

    // ---- 初始化:先讀localStorage的我的角色/預設角色覆寫,
    // 再向後端要預設角色的原始清單(給「恢復預設」當還原目標)。 ----

    async function initRoleSystem() {
      customRoles = loadCustomRolesFromStorage();
      const overrides = loadPresetOverridesFromStorage();
      try {
        const res = await fetch("/api/roles");
        const data = await res.json();
        presetRoles = (data.roles || []).map((r) => ({
          id: r.id,
          kind: "preset",
          icon: r.icon,
          label: r.label,
          defaultPromptTemplate: r.promptTemplate,
          promptTemplate: overrides[r.id] || r.promptTemplate,
        }));
      } catch {
        // 抓不到預設角色清單(伺服器還沒起來/網路問題),選單裡「預設
        // 角色」區塊會是空的,不影響「我的角色」正常建立/選取/使用。
        presetRoles = [];
      }
      renderRoleMenu();
      syncRoleSelectorWithProvider();
    }
    initRoleSystem();

    // 首頁歡迎文案:集中管理在這裡,之後要新增/刪除文案,只要改
    // WELCOME_MESSAGE_POOLS.default 這個陣列即可。目前只實作「每次開啟
    // /重新整理首頁時隨機選一則」,不做輪播動畫或定時切換。
    //
    // 預留擴充性:之後如果要依時段(早上/下午/晚上)或節日(聖誕節/新年)
    // 顯示不同文案,可以在這個物件裡比照 default 的格式加上對應的陣列
    // (例如 morning: [...]、christmas: [...]),再修改 pickWelcomeMessage()
    // 內部選取要用哪個陣列的邏輯即可,不用動到下面呼叫的地方。
    const WELCOME_MESSAGE_POOLS = {
      default: [
        "今天想學點什麼?",
        "有任何問題,直接問吧!",
        "今天一起打造更聰明的 AI。",
        "歡迎回來,準備開始了嗎?",
        "有什麼想探索的嗎?",
        "把你的想法交給我吧。",
        "今天想完成什麼目標?",
        "開始聊天,看看能激發什麼靈感。",
        "需要幫忙嗎?我在這裡。",
        "不知道從哪開始?隨便問一個問題吧。",
        "一起把想法變成成果。",
        "今天想寫程式、聊天,還是學新東西?",
        "每個問題,都是新的開始。",
        "試著問我任何事情。",
        "你的下一個靈感,也許就從這裡開始。",
        "今天也一起進步吧!",
        "準備好了嗎?開始吧!",
        "歡迎回來,很高興再次見到你。",
        "有什麼計畫?一起完成它。",
        "把困難交給我,一起找答案。",
        "今天想挑戰點什麼?",
        "聊天、創作、學習,都可以。",
        "想到什麼,就直接說吧。",
        "新的對話,新的可能。",
        "讓我們一起完成今天的任務。",
        "每一次提問,都值得認真回答。",
        "開始今天的第一個問題吧。",
        "需要靈感?我們一起想。",
        "今天也會是充滿收穫的一天。",
        "準備好開始了嗎?",
      ],
    };

    function pickWelcomeMessage() {
      const pool = WELCOME_MESSAGE_POOLS.default;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    composerHeading.textContent = pickWelcomeMessage();
    const addBtn = document.getElementById("addBtn");
    const imageInput = document.getElementById("imageInput");
    const attachmentPreview = document.getElementById("attachmentPreview");
    const attachmentThumb = document.getElementById("attachmentThumb");
    const attachmentName = document.getElementById("attachmentName");
    const attachmentRemove = document.getElementById("attachmentRemove");

    // 點快速提示按鈕,直接把範例文字填進輸入框並聚焦,不自動送出
    quickActions.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-prompt]");
      if (!btn) return;
      textarea.value = btn.dataset.prompt;
      textarea.focus();
    });

    // ---- 附件圖片(目前唯一用途:拼豆對照圖) ----
    // 選好的圖片先轉成 data URL 存在記憶體裡,送出訊息時才一起打包送出,
    // 不會在選圖的當下就先發請求。
    let attachedImageDataUrl = null;

    addBtn.addEventListener("click", () => imageInput.click());

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        attachedImageDataUrl = reader.result;
        attachmentThumb.src = attachedImageDataUrl;
        attachmentName.textContent = file.name;
        attachmentPreview.classList.add("visible");
      };
      reader.readAsDataURL(file);
    });

    function clearAttachment() {
      attachedImageDataUrl = null;
      imageInput.value = "";
      attachmentPreview.classList.remove("visible");
      attachmentThumb.src = "";
      attachmentName.textContent = "";
    }

    attachmentRemove.addEventListener("click", clearAttachment);

    // 判斷這次送出是不是「拼豆對照圖」請求:必須同時有附件圖片,
    // 而且文字裡有提到「拼豆」,兩個條件都符合才會走這條路,
    // 避免使用者只是隨口附了張圖聊天,卻被誤判成要生成拼豆圖。
    // 「拚豆」是實際觀察到的常見打字/選字變體(拚 vs 拼,注音打字容易
    // 選錯同音字),一併認得。
    function isBeadPatternRequest(promptText) {
      return Boolean(attachedImageDataUrl) &&
        (promptText.includes("拼豆") || promptText.includes("拚豆"));
    }

    // 把色號用量表渲染成一排排小色塊 + 文字,由多到少排序(後端已經排好序)。
    function renderBeadLegend(colors) {
      const legend = document.createElement("div");
      legend.className = "bead-legend";
      colors.forEach((c) => {
        const item = document.createElement("span");
        const [r, g, b] = c.rgb;
        item.innerHTML =
          `<span class="swatch" style="background: rgb(${r},${g},${b})"></span>` +
          `${c.code} ${c.name} × ${c.count}`;
        legend.appendChild(item);
      });
      return legend;
    }

    // 拼豆結果訊息:圖片 + 色號表 + 一個可以調整格數重新產生的小工具。
    // sourceImageDataUrl 是原始上傳的圖片,調整格數時要用同一張圖重打一次。
    // 圖片(data URI)是非同步解碼的,appendChild 當下瀏覽器還不知道
    // 圖片實際撐開後的高度,這時候捲到底其實捲得不夠,會讓圖片下半部
    // (色號表、調整格數的控制項)被輸入框擋住看不到。除了等 img 的
    // load 事件,再加兩層 requestAnimationFrame 確保瀏覽器真的完成
    // 這次 reflow/paint 之後才捲動,比只聽 load 事件更保險。
    function scrollMessagesToBottomAfterImage(containerEl) {
      const scrollToBottom = () => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
          });
        });
      };
      scrollToBottom();
      const img = containerEl.querySelector("img");
      if (img && !img.complete) {
        img.addEventListener("load", scrollToBottom, { once: true });
      } else {
        scrollToBottom();
      }
    }

    function renderBeadResult(data, sourceImageDataUrl) {
      const wrap = document.createElement("div");
      wrap.className = "bead-result";

      const img = document.createElement("img");
      img.src = data.image;
      img.alt = "拼豆對照圖(點擊放大)";
      img.addEventListener("click", () => openLightbox(data.image));
      wrap.appendChild(img);

      const summary = document.createElement("div");
      summary.className = "bead-legend";
      summary.style.color = "#FFFFFF";
      summary.textContent = `${data.gridWidth} × ${data.gridHeight} 格,共 ${data.totalBeads} 顆珠子`;
      wrap.appendChild(summary);

      wrap.appendChild(renderBeadLegend(data.colors));

      const controls = document.createElement("div");
      controls.className = "bead-controls";
      controls.innerHTML =
        '<span>調整寬度(格數):</span>' +
        `<input type="number" min="5" max="100" value="${data.gridWidth}">` +
        '<button type="button">重新產生</button>';
      const input = controls.querySelector("input");
      const regenBtn = controls.querySelector("button");
      regenBtn.addEventListener("click", async () => {
        regenBtn.disabled = true;
        regenBtn.textContent = "產生中...";
        try {
          const newData = await requestBeadPattern(sourceImageDataUrl, Number(input.value));
          const newResult = renderBeadResult(newData, sourceImageDataUrl);
          wrap.replaceWith(newResult);
          scrollMessagesToBottomAfterImage(newResult);
        } catch (err) {
          regenBtn.disabled = false;
          regenBtn.textContent = "重新產生";
          addMessage("拼豆對照圖產生失敗,請稍後再試一次。", "error");
        }
      });
      wrap.appendChild(controls);

      return wrap;
    }

    // ---- 圖片放大燈箱:目前只有拼豆對照圖會用到,但寫成通用函式,
    // 之後如果有其他地方要顯示圖片也能直接複用。 ----
    const imageLightbox = document.getElementById("imageLightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    function openLightbox(src) {
      lightboxImg.src = src;
      imageLightbox.classList.add("visible");
    }

    function closeLightbox() {
      imageLightbox.classList.remove("visible");
      lightboxImg.src = "";
    }

    imageLightbox.addEventListener("click", closeLightbox);

    async function requestBeadPattern(imageDataUrl, gridWidth) {
      const res = await fetch("/api/bead_pattern", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageDataUrl, gridWidth }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || "拼豆對照圖產生失敗");
      }
      return data;
    }

    function addMessage(text, role) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    // 統一的 token 計數器文字格式(一般單一回覆的串流模式、NexoraAI團隊
    // 模式都共用):「{分}m {秒}s {token數} tokens」,例如「2m 56s 312 tokens」。
    function formatElapsedTokens(elapsedMs, tokens) {
      const totalSeconds = Math.max(0, Math.floor(elapsedMs / 1000));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}m ${s}s ${tokens} tokens`;
    }

    // NexoraAI 團隊模式(composer 選了角色時):後端改成 NDJSON 串流,
    // 每個角色的文字一生成出來就送過來(見 server.py/api/generate.py 的
    // team_stream()),不用等所有角色+整合都生成完才第一次看到任何內容。
    // 角色圖示一律用固定SVG(見上面 ROLE_ICON_SVG),角色名稱(不管是預設
    // 4種還是使用者自訂)一律走 textContent,不會被當成HTML解析,避免
    // 使用者自訂角色名稱夾帶標籤造成XSS。
    function buildTeamRoleLabel(iconKey, labelText) {
      const label = document.createElement("div");
      label.className = "team-role-label";
      label.appendChild(buildRoleIconSpan(iconKey));
      const textSpan = document.createElement("span");
      textSpan.textContent = labelText;
      label.appendChild(textSpan);
      return label;
    }

    // 讀取團隊模式的 NDJSON 串流,逐段把文字打進對應角色的泡泡裡。因為
    // 後端是依序處理每個角色(不是同時平行生成),同一時間永遠只有一個
    // 角色在收 delta,這裡用單一佇列 + 固定節奏吐字(跟一般單一問答模式
    // 的打字機效果同一套手法),就能讓每個角色泡泡看起來依序逐字打出來。
    async function streamTeamReply(res, elapsedStartTime) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let lineBuffer = "";
      let streamDone = false;
      let finalTokenCount = null;
      const queue = []; // {ch, el}
      const roleBodyEls = new Map(); // role id -> 該角色回覆文字所在的元素

      function ensureRoleBubble(msg) {
        if (roleBodyEls.has(msg.role)) return roleBodyEls.get(msg.role);
        const el = document.createElement("div");
        if (msg.role === "integration") {
          el.className = "msg assistant team-integration-msg";
        } else if (msg.role === "error") {
          el.className = "msg error";
        } else {
          el.className = "msg assistant team-role-msg";
        }
        if (msg.role !== "error") {
          el.appendChild(buildTeamRoleLabel(msg.icon, msg.label));
        }
        const body = document.createElement("div");
        el.appendChild(body);
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        roleBodyEls.set(msg.role, body);
        return body;
      }

      function handleLine(line) {
        line = line.trim();
        if (!line) return;
        let msg;
        try {
          msg = JSON.parse(line);
        } catch {
          return; // 協定固定是一行一個JSON,理論上不該發生
        }
        if (msg.done) {
          finalTokenCount = msg.total_tokens;
          return;
        }
        if (msg.role_start) {
          ensureRoleBubble(msg);
          return;
        }
        if (typeof msg.delta === "string") {
          const bodyEl = roleBodyEls.get(msg.role);
          if (!bodyEl) return; // 保底:理論上role_start一定先送到
          for (const ch of msg.delta) {
            queue.push({ ch, el: bodyEl });
          }
        }
        // role_done 只是給後端內部組整合提示語用,文字本身已經透過delta
        // 進到佇列了,前端不用再另外處理。
      }

      const pump = (async () => {
        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            lineBuffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = lineBuffer.indexOf("\n")) !== -1) {
              handleLine(lineBuffer.slice(0, idx));
              lineBuffer = lineBuffer.slice(idx + 1);
            }
          }
          if (lineBuffer) handleLine(lineBuffer);
        } catch (err) {
          if (err.name !== "AbortError") throw err;
        } finally {
          streamDone = true;
        }
      })();

      while (!streamDone || queue.length > 0) {
        if (queue.length > 0) {
          const { ch, el } = queue.shift();
          el.textContent += ch;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        await new Promise((r) => setTimeout(r, 12));
      }
      await pump;

      const tokenCounterEl = document.createElement("div");
      tokenCounterEl.className = "token-counter";
      tokenCounterEl.textContent = formatElapsedTokens(Date.now() - elapsedStartTime, finalTokenCount || 0);
      messagesEl.appendChild(tokenCounterEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      const integrationBodyEl = roleBodyEls.get("integration");
      return integrationBodyEl ? integrationBodyEl.textContent : "";
    }

    // 把文字一個字一個字打進指定的訊息元素裡,固定節奏顯示,
    // 不管文字是一次到齊(Vercel 的 JSON 回應)還是分批到齊(本機串流),
    // 畫面上看起來都會是穩定的打字機效果。
    function typeOutText(el, text, delayMs = 12, signal = null) {
      return new Promise((resolve) => {
        let i = 0;
        function step() {
          // 打字動畫進行中被按下停止,直接顯示目前已經打出來的部分就好,
          // 不用把剩下的文字硬吐完。
          if (signal && signal.aborted) {
            resolve();
            return;
          }
          if (i < text.length) {
            el.textContent += text[i];
            i++;
            messagesEl.scrollTop = messagesEl.scrollHeight;
            setTimeout(step, delayMs);
          } else {
            resolve();
          }
        }
        step();
      });
    }

    // 使用者問「現在幾點」時,在回覆文字上方插入一張時鐘卡片(Rectangle 7),
    // 顯示即時更新的 HH:MM:SS,讓回覆不只是一句話,而是像小工具一樣。
    function renderTimeCard() {
      const card = document.createElement("div");
      card.className = "time-card";

      const display = document.createElement("span");
      display.className = "time-card-display";
      card.appendChild(display);

      // 垂直滑動開關:只有這個開關能點/拖曳,不是整張卡片。
      const switchEl = document.createElement("div");
      switchEl.className = "time-card-switch";
      switchEl.title = "點一下或拖曳切換 12 / 24 小時制";
      const thumb = document.createElement("div");
      thumb.className = "time-card-switch-thumb";
      switchEl.appendChild(thumb);
      card.appendChild(switchEl);

      const label = document.createElement("span");
      label.className = "time-card-switch-label";
      card.appendChild(label);

      messagesEl.appendChild(card);

      // 預設 12 小時制,點開關切換成 24 小時制,再點一次切回去。
      let use24Hour = false;
      const pad = (n) => String(n).padStart(2, "0");

      function render() {
        switchEl.classList.toggle("is-24h", use24Hour);
        label.textContent = use24Hour ? "24小時制" : "12小時制";
      }

      function tick() {
        const now = new Date();
        const seconds = pad(now.getSeconds());
        if (use24Hour) {
          display.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${seconds}`;
        } else {
          const hour12 = now.getHours() % 12 || 12;
          display.textContent = `${pad(hour12)}:${pad(now.getMinutes())}:${seconds}`;
        }
      }
      render();
      tick();
      setInterval(tick, 1000);

      // 滑塊可以直接拖曳,放開時依最後停的位置吸附到12/24小時制;
      // 單純點一下(沒有拖曳位移)效果等同直接觸發一次吸附判斷,
      // 所以不需要另外寫一個點擊事件。
      const THUMB_TOP_MIN = 1;   // 12小時制(靠上)
      const THUMB_TOP_MAX = 31;  // 24小時制(靠下)
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      let dragging = false;
      let trackTop = 0;

      function onPointerDown(e) {
        dragging = true;
        trackTop = switchEl.getBoundingClientRect().top;
        thumb.style.transition = "none";
        switchEl.setPointerCapture(e.pointerId);
        onPointerMove(e);
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const y = e.clientY - trackTop - thumb.offsetHeight / 2;
        thumb.style.top = `${clamp(y, THUMB_TOP_MIN, THUMB_TOP_MAX)}px`;
      }

      function onPointerUp() {
        if (!dragging) return;
        dragging = false;
        const droppedTop = parseFloat(thumb.style.top || THUMB_TOP_MIN);
        thumb.style.transition = "";
        thumb.style.top = "";
        use24Hour = droppedTop > (THUMB_TOP_MIN + THUMB_TOP_MAX) / 2;
        render();
        tick();
      }

      switchEl.addEventListener("pointerdown", onPointerDown);
      switchEl.addEventListener("pointermove", onPointerMove);
      switchEl.addEventListener("pointerup", onPointerUp);
      switchEl.addEventListener("pointercancel", onPointerUp);

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 還沒有任何訊息時,把輸入框往上移到畫面偏中央的位置(比照設計稿 Rectangle 12),
    // 送出第一則訊息後,再讓它滑動回到底部(比照設計稿 Rectangle 13)。
    const CENTERED_VERTICAL_RATIO = 720 / 1440; // Rectangle 12 垂直中心 / 畫布高度(top:655 之後剛好是畫面正中央)

    function centerComposerIfEmpty() {
      if (messagesEl.children.length > 0) return;
      form.style.transition = "none";
      form.style.transform = "translateY(0px)";
      // 用膠囊本身(.composer-pill)的中心點來對齊,而不是整個 form 的中心點,
      // 因為 form 裡面還包含下方的快速提示按鈕列,用 form 整體的中心點會算偏。
      const rect = document.querySelector(".composer-pill").getBoundingClientRect();
      const currentCenterY = rect.top + rect.height / 2;
      const targetCenterY = window.innerHeight * CENTERED_VERTICAL_RATIO;
      const delta = targetCenterY - currentCenterY;
      // 關鍵順序:transition 仍是 none 的狀態下先把 transform 套到最終位置,
      // 這樣「跳到中間」這個動作本身不會被動畫包住,
      // 強制 reflow 讓瀏覽器把這個瞬間跳動畫面畫出來之後,才把 transition 復原,
      // 讓「復原 transition」這件事只影響之後(送出第一則訊息)的變化。
      form.style.transform = `translateY(${delta}px)`;
      void form.offsetHeight;
      form.style.transition = "";
    }

    function slideComposerToBottom() {
      form.style.transform = "translateY(0px)";
      // 輸入框已經滑到底部,跟訊息區不會再視覺重疊,不需要再讓訊息區
      // 滑鼠穿透,改回 auto 讓滾輪/觸控可以正常在訊息區滾動。
      messagesEl.style.pointerEvents = "auto";
      // 標題文字和快速提示按鈕只在還沒開始對話時出現,送出第一則訊息後
      // 平滑收合(透明度 + 高度 + margin 一起動畫),避免版面高度瞬間跳動造成畫面抖動。
      composerHeading.style.opacity = "0";
      composerHeading.style.maxHeight = "0px";
      composerHeading.style.marginBottom = "0px";
      quickActions.style.opacity = "0";
      quickActions.style.maxHeight = "0px";
      quickActions.style.marginTop = "0px";

      // 動畫結束後徹底移出版面(display:none),避免留下 0 高度的空殼元素。
      // 用 transitionend 抓精確時機,並保留一個跟 CSS transition 秒數一致的
      // 備援 timeout,避免極少數瀏覽器情境(例如分頁在背景)transitionend 沒觸發時卡住。
      let collapsed = false;
      function collapseQuickStart() {
        if (collapsed) return;
        collapsed = true;
        composerHeading.style.display = "none";
        quickActions.style.display = "none";
      }
      composerHeading.addEventListener("transitionend", collapseQuickStart, { once: true });
      setTimeout(collapseQuickStart, 350);
    }

    // 立刻同步執行(不等 load 事件),避免先在底部畫面停留一下才跳到中間、
    // 看起來像多了一次「往上滑」的動作。使用者只會看到它一開始就在中間位置。
    centerComposerIfEmpty();
    window.addEventListener("resize", centerComposerIfEmpty);

    // Enter 送出,Shift+Enter 換行
    textarea.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // 生成中(送出按鈕顯示停止圖示)再按一次,代表要中止目前的生成,
      // 而不是送出新訊息。
      if (activeAbortController) {
        activeAbortController.abort();
        return;
      }

      const prompt = textarea.value.trim();
      if (!prompt) return;

      const isFirstMessage = messagesEl.children.length === 0;

      // 送出前先把「目前為止」的歷史記下來,不包含這一句新輸入,
      // 這樣後端才能分清楚「已經聊過的內容」跟「這次的新問題」。
      const historyForRequest = conversationHistory.slice();

      // 判斷要不要走拼豆對照圖這條路,要在附件被 clearAttachment() 清掉
      // 之前先記錄下來,不然送出後圖片就沒了。
      const beadRequest = isBeadPatternRequest(prompt);
      const sourceImageForBead = attachedImageDataUrl;

      addMessage(prompt, "user");
      conversationHistory.push({ role: "user", text: prompt });
      textarea.value = "";
      clearAttachment();
      sendBtn.classList.add("generating");
      sendBtn.setAttribute("aria-label", "停止生成");
      activeAbortController = new AbortController();

      if (isFirstMessage) {
        slideComposerToBottom();
      }

      // 拼豆對照圖是完全獨立的一條路:打 /api/bead_pattern,不經過
      // /api/generate、不用語言模型,回覆也是圖片+色號表而不是文字。
      if (beadRequest) {
        try {
          const data = await requestBeadPattern(sourceImageForBead, DEFAULT_BEAD_GRID);
          const resultEl = renderBeadResult(data, sourceImageForBead);
          messagesEl.appendChild(resultEl);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          scrollMessagesToBottomAfterImage(resultEl);
          conversationHistory.push({ role: "assistant", text: "(已產生拼豆對照圖)" });
        } catch (err) {
          addMessage(err.message || "拼豆對照圖產生失敗,請稍後再試一次。", "error");
        } finally {
          sendBtn.classList.remove("generating");
          sendBtn.setAttribute("aria-label", "送出");
          activeAbortController = null;
          textarea.focus();
        }
        return;
      }

      // NexoraAI 團隊模式:composer 選了角色,改送 roleRequests(每個
      // 角色完整的 id/label/icon/promptTemplate,不管預設還是自訂角色
      // 都是同一種格式,包含使用者編輯過的內容)給後端,後端會用
      // NDJSON 串流依序回傳每個角色的文字(見 server.py/api/generate.py
      // 的 team_stream())。只支援own模型(切到其他provider時角色按鈕
      // 已經被停用並清空選取,syncRoleSelectorWithProvider()),這裡
      // 不用再另外判斷 provider。
      if (selectedRoles.size > 0) {
        const roleRequests = [...selectedRoles]
          .map((id) => findRoleById(id))
          .filter(Boolean)
          .map((role) => ({ id: role.id, label: role.label, icon: role.icon, promptTemplate: role.promptTemplate }));
        const teamStartTime = Date.now();
        try {
          // ---- Colab 模式:把角色 prompt 跟使用者訊息合在一起送出 ----
          if (COLAB_API_URL) {
            for (const role of roleRequests) {
              const combinedPrompt = (role.promptTemplate || "").replace("{{input}}", prompt) || prompt;
              const res = await fetch(COLAB_API_URL + "/api/chat", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "ngrok-skip-browser-warning": "1",
                },
                body: JSON.stringify({ prompt: combinedPrompt }),
                signal: activeAbortController.signal,
              });
              const data = await res.json();
              if (!res.ok || data.error) {
                addMessage(data.error || `${role.icon} ${role.label} 回覆失敗`, "error");
              } else {
                const el = document.createElement("div");
                el.className = "msg assistant";
                messagesEl.appendChild(el);
                const replyText = `${role.icon} ${role.label}\n${data.reply || "(無回覆)"}`;
                await typeOutText(el, replyText, 12, activeAbortController.signal);
                conversationHistory.push({ role: "assistant", text: replyText });
              }
            }
          }
          // ---- 原本的 Vercel / 本機團隊模式 ----
          else {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt,
              provider: "own",
              roleRequests,
              clientId: getClientId(),
            }),
            signal: activeAbortController.signal,
          });
          const contentType = res.headers.get("content-type") || "";
          if (!res.ok || contentType.includes("application/json")) {
            let errMsg = "團隊模式發生未知錯誤,請稍後再試。";
            try {
              const data = await res.json();
              errMsg = data.error || errMsg;
            } catch { /* 保底 */ }
            addMessage(errMsg, "error");
          } else {
            const integrationText = await streamTeamReply(res, teamStartTime);
            conversationHistory.push({ role: "assistant", text: integrationText });
            refreshQuotaDisplay();
          }
          } // end else (非 Colab)
        } catch (err) {
          if (err.name !== "AbortError") {
            addMessage(COLAB_API_URL
              ? "無法連線到 Colab 後端,請確認 ngrok 網址正確且 Colab 還在執行。"
              : "無法連線到伺服器,請確認 server.py 是否正在執行。", "error");
          }
        } finally {
          sendBtn.classList.remove("generating");
          sendBtn.setAttribute("aria-label", "送出");
          activeAbortController = null;
          textarea.focus();
        }
        return;
      }

      try {
        // ---- Colab 模式:直接 POST 到 ngrok,拿簡單 JSON 回來 ----
        if (COLAB_API_URL) {
          const res = await fetch(COLAB_API_URL + "/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "1",
            },
            body: JSON.stringify({ prompt }),
            signal: activeAbortController.signal,
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            addMessage(data.error || "Colab 後端回傳錯誤,請確認 Colab 是否還在執行。", "error");
          } else {
            const el = document.createElement("div");
            el.className = "msg assistant";
            messagesEl.appendChild(el);
            const replyText = data.reply || "(模型沒有生成任何內容)";
            await typeOutText(el, replyText, 12, activeAbortController.signal);
            conversationHistory.push({ role: "assistant", text: replyText });
            maybeOpenCodeEditorFromReply(replyText);
          }
        }
        // ---- 原本的 Vercel / 本機模式(COLAB_API_URL 空字串時走這裡) ----
        else {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            provider: providerSelect.value,
            history: historyForRequest,
            clientId: getClientId(),
          }),
          signal: activeAbortController.signal,
        });

        const contentType = res.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await res.json();
          if (!res.ok || data.error) {
            addMessage(data.error || "發生未知錯誤,請稍後再試。", "error");
          } else {
            if (data.type === "time") {
              renderTimeCard();
            }
            const el = document.createElement("div");
            el.className = "msg assistant";
            messagesEl.appendChild(el);
            const replyText = data.reply || "(模型沒有生成任何內容)";
            await typeOutText(el, replyText, 12, activeAbortController.signal);
            conversationHistory.push({ role: "assistant", text: replyText });
            maybeOpenCodeEditorFromReply(replyText);

            if (data.type === "time") {
              const now = new Date();
              const period = now.getHours() < 12 ? "上午" : "下午";
              const text24 = `現在是${period}${now.getHours()}點${now.getMinutes()}分。`;
              let showing24 = false;
              el.style.cursor = "pointer";
              el.title = "點一下切換 12 / 24 小時制";
              el.addEventListener("click", () => {
                showing24 = !showing24;
                el.textContent = showing24 ? text24 : replyText;
              });
            }
          }
        } else if (!res.ok) {
          addMessage("發生未知錯誤,請稍後再試。", "error");
        } else {
          const el = document.createElement("div");
          el.className = "msg assistant";
          messagesEl.appendChild(el);

          const streamStartTime = Date.now();
          const tokenCounterEl = document.createElement("div");
          tokenCounterEl.className = "token-counter";
          tokenCounterEl.textContent = formatElapsedTokens(0, 0);
          messagesEl.appendChild(tokenCounterEl);

          messagesEl.scrollTop = messagesEl.scrollHeight;

          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          const queue = [];
          let streamDone = false;
          let lineBuffer = "";
          let finalTokenCount = null;

          function handleStreamLine(line) {
            line = line.trim();
            if (!line) return;
            let msg;
            try {
              msg = JSON.parse(line);
            } catch (err) {
              queue.push(...line);
              return;
            }
            if (msg.done) {
              finalTokenCount = msg.total_tokens;
              tokenCounterEl.textContent = formatElapsedTokens(Date.now() - streamStartTime, finalTokenCount);
              refreshQuotaDisplay();
            } else if (typeof msg.delta === "string") {
              queue.push(...msg.delta);
              if (typeof msg.n === "number") {
                tokenCounterEl.textContent = formatElapsedTokens(Date.now() - streamStartTime, msg.n);
              }
            }
          }

          const pump = (async () => {
            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                lineBuffer += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = lineBuffer.indexOf("\n")) !== -1) {
                  handleStreamLine(lineBuffer.slice(0, idx));
                  lineBuffer = lineBuffer.slice(idx + 1);
                }
              }
              if (lineBuffer) handleStreamLine(lineBuffer);
            } catch (err) {
              if (err.name !== "AbortError") throw err;
            } finally {
              streamDone = true;
            }
          })();

          let received = "";
          while (!streamDone || queue.length > 0) {
            if (queue.length > 0) {
              received += queue.shift();
              el.textContent = received;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            await new Promise((r) => setTimeout(r, 12));
          }
          await pump;

          if (!received.trim()) {
            el.textContent = "(模型沒有生成任何內容)";
            tokenCounterEl.remove();
          } else {
            conversationHistory.push({ role: "assistant", text: received.trim() });
            maybeOpenCodeEditorFromReply(received.trim());
            if (finalTokenCount === null) {
              tokenCounterEl.remove();
            }
          }
        }
        } // end else (非 Colab 模式)
      } catch (err) {
        if (err.name !== "AbortError") {
          addMessage(COLAB_API_URL
            ? "無法連線到 Colab 後端,請確認 ngrok 網址正確且 Colab 還在執行。"
            : "無法連線到伺服器,請確認 server.py 是否正在執行。", "error");
        }
      } finally {
        sendBtn.classList.remove("generating");
        sendBtn.setAttribute("aria-label", "送出");
        activeAbortController = null;
        textarea.focus();
      }
    });
  </script>
</body>
</html>
